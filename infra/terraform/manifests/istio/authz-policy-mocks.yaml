# Only the backend workload's identity may call any mock downstream service.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mocks-allow-backend
  namespace: ${namespace}
spec:
  selector:
    matchLabels:
      app: user-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/${namespace}/sa/backend"
---
